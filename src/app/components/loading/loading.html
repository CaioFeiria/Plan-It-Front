<div *ngIf="isLoading" class="fixed inset-0 bg-gray-100 bg-opacity-30 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl p-12 flex flex-col items-center gap-6 shadow-2xl border border-gray-200">
    <!-- Animação do Lápis e Folha -->
    <div class="relative">
      <!-- Folha de papel -->
      <div class="w-24 h-32 bg-white border-2 border-gray-300 rounded-sm shadow-lg relative overflow-hidden">
        <!-- Linhas da folha -->
        <div class="absolute top-4 left-2 right-2 h-px bg-gray-200"></div>
        <div class="absolute top-8 left-2 right-2 h-px bg-gray-200"></div>
        <div class="absolute top-12 left-2 right-2 h-px bg-gray-200"></div>
        <div class="absolute top-16 left-2 right-2 h-px bg-gray-200"></div>
        <div class="absolute top-20 left-2 right-2 h-px bg-gray-200"></div>
        <div class="absolute top-24 left-2 right-2 h-px bg-gray-200"></div>
        
        <!-- Texto sendo escrito (animação) -->
        <div class="absolute top-2 left-3 right-2">
          <div class="writing-line"></div>
          <div class="writing-line delay-200"></div>
          <div class="writing-line delay-400"></div>
        </div>
      </div>
      
      <!-- Lápis -->
      <div class="absolute -top-2 -right-2 pencil-animation">
        <div class="w-1 h-8 bg-gradient-to-b from-yellow-400 to-yellow-600 rounded-full shadow-md"></div>
        <div class="w-1 h-2 bg-gray-600 rounded-full -mt-1"></div>
        <div class="w-0.5 h-1 bg-pink-400 rounded-full -mt-0.5"></div>
      </div>
    </div>
    
    <!-- Texto -->
    <div class="text-center">
      <h3 class="text-xl font-semibold text-gray-800 mb-2">Carregando...</h3>
      <p class="text-sm text-gray-500">Aguarde um momento</p>
    </div>
  </div>
</div>
