<div class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
  <!-- Left side: Menu button + Logo -->
  <div class="flex items-center gap-4">
    <button 
      (click)="onMenuToggle()"
      class="p-2 hover:bg-gray-100 rounded-lg transition-colors duration-200">
      <i class="pi pi-bars text-gray-600"></i>
    </button>
    
    <div class="flex items-center gap-3">
      <i class="pi pi-calendar text-2xl text-blue-600"></i>
      <h1 class="text-xl font-bold text-gray-800">Plan-It</h1>
    </div>
  </div>

  <!-- Right side: User info + Logout -->
  <div class="flex items-center gap-3">
    <span class="text-sm text-gray-600">{{ usuario?.nome || 'Usuário' }}</span>
    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
      <i class="pi pi-user text-blue-600 text-sm"></i>
    </div>
    <button 
      (click)="logout()"
      class="p-2 hover:bg-gray-100 rounded-lg transition-colors duration-200"
      title="Sair">
      <i class="pi pi-sign-out text-gray-600"></i>
    </button>
  </div>
</div>
