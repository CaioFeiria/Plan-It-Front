<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Projetos</h1>
    <button 
      (click)="criarProjeto()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors duration-200">
      <i class="pi pi-plus"></i>
      <span>Novo Projeto</span>
    </button>
  </div>

  <!-- Data Table -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <p-table 
      [value]="projetos" 
      [paginator]="true" 
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} projetos"
      [rowsPerPageOptions]="[5, 10, 25]"
      styleClass="p-datatable-sm">
      
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id">
            ID <p-sortIcon field="id"></p-sortIcon>
          </th>
          <th pSortableColumn="nome">
            Nome <p-sortIcon field="nome"></p-sortIcon>
          </th>
          <th pSortableColumn="descricao">
            Descrição <p-sortIcon field="descricao"></p-sortIcon>
          </th>
          <th style="width: 120px;">Ações</th>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="body" let-projeto>
        <tr>
          <td>{{ projeto.id }}</td>
          <td>{{ projeto.nome }}</td>
          <td>{{ projeto.descricao }}</td>
          <td>
            <div class="flex gap-2">
              <button 
                (click)="editarProjeto(projeto.id!)"
                class="p-1 text-blue-600 hover:bg-blue-50 rounded transition-colors duration-200"
                pTooltip="Editar">
                <i class="pi pi-pencil"></i>
              </button>
              <button 
                (click)="excluirProjeto(projeto.id!)"
                class="p-1 text-red-600 hover:bg-red-50 rounded transition-colors duration-200"
                pTooltip="Excluir">
                <i class="pi pi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center py-8 text-gray-500">
            <i class="pi pi-folder text-4xl mb-2 block"></i>
            Nenhum projeto encontrado
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
