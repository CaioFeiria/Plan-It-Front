<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Tarefas</h1>
    <button 
      (click)="criarTarefa()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors duration-200">
      <i class="pi pi-plus"></i>
      <span>Nova Tarefa</span>
    </button>
  </div>

  <!-- Data Table -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <p-table 
      [value]="tarefas" 
      [paginator]="true" 
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} tarefas"
      [rowsPerPageOptions]="[5, 10, 25]"
      styleClass="p-datatable-sm">
      
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id">
            ID <p-sortIcon field="id"></p-sortIcon>
          </th>
          <th pSortableColumn="nome">
            Nome <p-sortIcon field="nome"></p-sortIcon>
          </th>
          <th pSortableColumn="prioridade">
            Prioridade <p-sortIcon field="prioridade"></p-sortIcon>
          </th>
          <th pSortableColumn="dataConclusao">
            Data Conclusão <p-sortIcon field="dataConclusao"></p-sortIcon>
          </th>
          <th style="width: 120px;">Ações</th>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="body" let-tarefa>
        <tr>
          <td>{{ tarefa.id }}</td>
          <td>{{ tarefa.nome }}</td>
          <td>
            <span 
              class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="{
                'bg-gray-100 text-gray-800': tarefa.prioridade === 'BAIXA',
                'bg-yellow-100 text-yellow-800': tarefa.prioridade === 'MEDIA',
                'bg-orange-100 text-orange-800': tarefa.prioridade === 'ALTA',
                'bg-red-100 text-red-800': tarefa.prioridade === 'URGENTE'
              }">
              {{ tarefa.prioridade || 'Não definida' }}
            </span>
          </td>
          <td>{{ tarefa.dataConclusao | date:'dd/MM/yyyy' }}</td>
          <td>
            <div class="flex gap-2">
              <button 
                (click)="editarTarefa(tarefa.id!)"
                class="p-1 text-blue-600 hover:bg-blue-50 rounded transition-colors duration-200"
                pTooltip="Editar">
                <i class="pi pi-pencil"></i>
              </button>
              <button 
                (click)="excluirTarefa(tarefa.id!)"
                class="p-1 text-red-600 hover:bg-red-50 rounded transition-colors duration-200"
                pTooltip="Excluir">
                <i class="pi pi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center py-8 text-gray-500">
            <i class="pi pi-check-square text-4xl mb-2 block"></i>
            Nenhuma tarefa encontrada
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
