<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Usuários</h1>
    <button 
      (click)="criarUsuario()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors duration-200">
      <i class="pi pi-plus"></i>
      <span>Novo Usuário</span>
    </button>
  </div>

  <!-- Content Card -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="text-center p-8">
      <i class="pi pi-users text-6xl text-gray-400 mb-4"></i>
      <h3 class="text-xl font-semibold text-gray-700 mb-2">Gerenciar Usuários</h3>
      <p class="text-gray-600">Adicione, edite e gerencie os usuários do sistema.</p>
    </div>
  </div>
</div>
